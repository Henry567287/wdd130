<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapids White Water Rafting Company</title>
    <meta name="description"
      content="Get in touch with Rapids White Water Rafting Company. Find our contact details, location map, meet our team, or send us a secure message.">
    <meta name="author" content="Henry Tibenkana">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="Rapids White Water Rafting Company logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-wireframe-container">

        <section class="company-heading-block">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="map-and-form-row">
            <div class="map-box">
                <iframe
                  src="https://maps.google.com/maps?q=Kolob%20California&t=&z=13&ie=UTF-8&iwloc=&output=embed"
                  width="100%" height="350" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="form-box">
                <form action="#" method="post" class="wireframe-form">
                    <div class="input-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="user_name" required
                          placeholder="Placeholder">
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="user_email" required
                          placeholder="Placeholder">
                    </div>

                    <div class="radio-container">
                        <span class="radio-title">Message Purpose</span>
                        <div class="radio-options">
                            <label for="purpose-general">
                                <input type="radio" id="purpose-general" name="purpose"
                                  value="general" checked> General Inquiry
                            </label>
                            <label for="purpose-reservation">
                                <input type="radio" id="purpose-reservation" name="purpose"
                                  value="reservation"> Reservation Question
                            </label>
                            <label for="purpose-suggestion">
                                <input type="radio" id="purpose-suggestion" name="purpose"
                                  value="suggestion"> Website Suggestion
                            </label>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="user_message" rows="4" required
                          placeholder="Type here"></textarea>
                    </div>

                    <div class="checkbox-group">
                        <label for="subscribe-newsletter">
                            <input type="checkbox" id="subscribe-newsletter" name="subscribe"
                              value="yes"> Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit" class="wireframe-submit-btn">Get in Touch!</button>
                </form>
            </div>
        </section>

        <section class="team-showcase-box">
            <h2>We Are Here to Serve You</h2>
            <div class="team-row">
                <figure>
                    <img src="images/rafting60_1024.jpg"
                      alt="Employee Profile Portrait of Lead River Guide">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting10_1024.jpg"
                      alt="Employee Profile Portrait of Logistics Manager">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting12_1024.jpg"
                      alt="Employee Profile Portrait of Safety Officer">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 | White Water Rafting Company | Henry Tibenkana</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-square.svg"
                  alt="Facebook Navigation Icon Link"></a>
            <a href="https://twitter.com"><img src="images/linkedin-square.svg"
                  alt="Twitter/X Navigation Icon Link"></a>
            <a href="https://instagram.com"><img src="images/instagram-square.svg"
                  alt="Instagram Navigation Icon Link"></a>
        </nav>
    </footer>
</body>

</html>
